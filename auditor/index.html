<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ONI Authority Auditor</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green: #1D9E75; --green-light: #E1F5EE; --green-mid: #5DCAA5;
    --green-dark: #085041; --amber: #EF9F27; --red: #E24B4A;
    --text-primary: #1a1a1a; --text-secondary: #666; --text-muted: #999;
    --border: rgba(0,0,0,0.12); --bg: #fff; --bg-secondary: #f7f7f5;
    --radius: 10px; --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: #f0ede8; --text-secondary: #a8a49e; --text-muted: #6b6760;
      --border: rgba(255,255,255,0.1); --bg: #1a1a18; --bg-secondary: #242420;
    }
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text-primary); min-height: 100vh; display: flex; justify-content: center; padding: 2rem 1rem 4rem; }
  .wrap { width: 100%; max-width: 560px; }
  .header { margin-bottom: 2rem; padding-top: 1rem; }
  .logo { font-size: 10px; font-weight: 600; letter-spacing: 0.18em; color: var(--green); text-transform: uppercase; margin-bottom: 0.6rem; }
  .title { font-size: 26px; font-weight: 600; color: var(--text-primary); line-height: 1.25; }
  .subtitle { font-size: 15px; color: var(--text-secondary); margin-top: 0.4rem; line-height: 1.5; }
  .progress-bar { display: flex; gap: 5px; margin-bottom: 2.5rem; }
  .pd { height: 3px; flex: 1; background: var(--border); border-radius: 2px; transition: background 0.3s; }
  .pd.done { background: var(--green); }
  .pd.active { background: var(--green-mid); }
  .step { display: none; }
  .step.active { display: block; }
  .sec-label { font-size: 10px; font-weight: 600; letter-spacing: 0.15em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 1.5rem; }
  .field { margin-bottom: 1.5rem; }
  .field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .field label em { color: var(--green); font-style: normal; }
  input[type=text], input[type=email], textarea { width: 100%; background: var(--bg); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; font-family: inherit; resize: vertical; transition: border 0.2s; }
  input[type=text]:focus, input[type=email]:focus, textarea:focus { outline: none; border-color: var(--green); }
  textarea { min-height: 90px; }
  .togs { display: flex; gap: 7px; flex-wrap: wrap; }
  .tog { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); font-size: 13px; cursor: pointer; color: var(--text-secondary); background: var(--bg); transition: all 0.15s; user-select: none; }
  .tog:hover { border-color: var(--green); color: var(--green); }
  .tog.sel { background: var(--green-light); border-color: var(--green); color: var(--green-dark); font-weight: 500; }
  @media (prefers-color-scheme: dark) { .tog.sel { background: rgba(29,158,117,0.2); color: var(--green-mid); } }
  .btn-row { display: flex; justify-content: space-between; align-items: center; margin-top: 2.5rem; }
  .btn-next { padding: 11px 28px; background: var(--green); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
  .btn-next:hover { opacity: 0.85; }
  .btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-back { font-size: 13px; color: var(--text-muted); cursor: pointer; background: none; border: none; }
  .btn-back:hover { color: var(--text-secondary); }
  .err { font-size: 12px; color: var(--red); margin-top: 5px; display: none; }
  .analyzing { text-align: center; padding: 4rem 0; display: none; }
  .analyzing.vis { display: block; }
  .spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .analyzing p { font-size: 14px; color: var(--text-secondary); }
  .free-preview { display: none; }
  .free-preview.vis { display: block; }
  .score-block { display: flex; gap: 1.5rem; align-items: center; padding: 1.5rem; background: var(--bg-secondary); border-radius: var(--radius-lg); margin-bottom: 2rem; }
  .ring-wrap { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 600; color: var(--text-primary); }
  .score-info h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .score-info p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .locked-section { margin-bottom: 2rem; }
  .locked-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; filter: blur(4px); user-select: none; pointer-events: none; }
  .pillar { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .p-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .p-name { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
  .p-score { font-size: 14px; font-weight: 600; }
  .p-bg { height: 3px; background: var(--border); border-radius: 2px; }
  .p-fill { height: 3px; border-radius: 2px; }
  .paywall { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; text-align: center; margin-bottom: 2rem; }
  .paywall-icon { font-size: 28px; margin-bottom: 0.75rem; }
  .paywall h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .paywall p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.25rem; }
  .paywall-items { text-align: left; margin-bottom: 1.5rem; }
  .paywall-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
  .paywall-item span.tick { color: var(--green); font-weight: 600; }
  .paywall-price { font-size: 22px; font-weight: 700; color: var(--text-primary); margin-bottom: 1rem; }
  .paywall-price small { font-size: 13px; font-weight: 400; color: var(--text-muted); }
  .email-gate { margin-bottom: 1rem; }
  .btn-pay { width: 100%; padding: 14px; background: var(--green); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; }
  .btn-pay:hover { opacity: 0.85; }
  .btn-pay:disabled { opacity: 0.5; cursor: not-allowed; }
  .secure-note { font-size: 11px; color: var(--text-muted); margin-top: 8px; }
  .report { display: none; }
  .report.vis { display: block; }
  .pillars-full { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 2rem; }
  .pillar-full { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
  .pf-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .pf-name { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
  .pf-score { font-size: 14px; font-weight: 600; }
  .pf-bg { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 8px; }
  .pf-fill { height: 3px; border-radius: 2px; transition: width 1s ease; }
  .pf-note { font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
  .fixes-title { font-size: 10px; font-weight: 600; letter-spacing: 0.14em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 1rem; }
  .fix { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .fix-num { font-size: 10px; font-weight: 600; color: var(--green); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 4px; }
  .fix-h { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
  .fix-b { font-size: 13px; color: var(--text-secondary); line-height: 1.65; }
  .hl-box { background: var(--green-light); border: 1px solid var(--green-mid); border-radius: var(--radius); padding: 16px; margin: 1.5rem 0; }
  @media (prefers-color-scheme: dark) { .hl-box { background: rgba(29,158,117,0.15); border-color: rgba(29,158,117,0.3); } }
  .hl-label { font-size: 10px; font-weight: 600; color: var(--green); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .hl-text { font-size: 15px; color: var(--green-dark); font-weight: 500; line-height: 1.5; }
  @media (prefers-color-scheme: dark) { .hl-text { color: var(--green-mid); } }
  .ctas { display: flex; gap: 10px; margin-top: 1.5rem; }
  .cta-p { flex: 1; padding: 13px; background: var(--green); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; }
  .cta-p:hover { opacity: 0.85; }
  .cta-s { flex: 1; padding: 13px; background: var(--bg); color: var(--text-primary); border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; cursor: pointer; }
  .cta-s:hover { background: var(--bg-secondary); }
  .success-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--green-light); border: 1px solid var(--green-mid); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--green-dark); margin-bottom: 1.5rem; }
  @media (prefers-color-scheme: dark) { .success-badge { background: rgba(29,158,117,0.2); color: var(--green-mid); } }
</style>
</head>

<body>
